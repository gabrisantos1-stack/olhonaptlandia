name: Atualizar o site

on:
  schedule:
    - cron: "17 8 * * *"   # todo dia às 05:17 de Brasília
  workflow_dispatch:        # permite rodar na mão pelo botão "Run workflow"
  push:
    branches: [main]
    paths: ["robo/**", "site/index.html", ".github/workflows/atualizar.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar dados da Câmara e montar o site
        run: python robo/atualizar.py
      - name: Guardar os dados novos no repositório
        run: |
          git config user.name "robo-raio-x"
          git config user.email "robo-raio-x@users.noreply.github.com"
          git add site/dados.js site/resumo.json
          git diff --cached --quiet || git commit -m "Dados atualizados em $(TZ=America/Sao_Paulo date +%d/%m/%Y)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
